name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Official Source & Baserom
        run: |
          # 1. Back up the baserom securely to /tmp
          cp baserom*.z64 /tmp/ 2>/dev/null || true
          
          # 2. Completely wipe everything, including hidden files like .git
          shopt -s dotglob
          rm -rf *
          
          # 3. Clone the official OMM repository directly into the workspace root
          git clone --recursive https://github.com/PeachyPeachSM64/sm64ex-omm.git .
          
          # 4. Restore the baserom back into the root directory
          cp /tmp/baserom*.z64 ./ 2>/dev/null || true
          
          # 5. List files to verify the Makefile is present
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget zip unzip curl make python3 libglew-dev libsdl2-dev patch

      - name: Setup Android SDK & NDK Manually
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandlinetools.zip
          unzip -q commandlinetools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"
          
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Apply 60FPS Patch
        run: |
          if [ -f "tools/apply_patch.sh" ] && [ -f "enhancements/60fps_ex.patch" ]; then
            bash tools/apply_patch.sh enhancements/60fps_ex.patch
          fi

      - name: Build OMM APK with Options & DynOS
        run: |
          make -j$(nproc) TARGET_ANDROID=1 VERSION=us EXT_OPTIONS_MENU=1 DYNOS=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm64ex-omm-apk
          path: build/us_android/*.apk
